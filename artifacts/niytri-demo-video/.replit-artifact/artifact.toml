kind = "video"
previewPath = "/niytri-demo-video/"
title = "NIYTRI CRM Demo Video"
version = "1.0.0"
id = "artifacts/niytri-demo-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/niytri-demo-video/" ]
localPort = 24031

[services.development]
run = "pnpm --filter @workspace/niytri-demo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/niytri-demo-video", "run", "build" ]
publicDir = "artifacts/niytri-demo-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24031"
BASE_PATH = "/niytri-demo-video/"
